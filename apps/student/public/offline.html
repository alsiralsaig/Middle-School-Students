<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>بدون إنترنت — منصة الطالب السوداني</title>
    <style>
      body { margin:0; min-height:100vh; display:grid; place-items:center; background:#071322; color:#e2e8f0;
             font-family: system-ui, "Segoe UI", Tahoma, sans-serif; text-align:center; padding:24px; }
      .box { max-width:420px; }
      h1 { font-size:20px; margin:16px 0 8px; }
      p { font-size:14px; line-height:1.9; color:#94a3b8; }
      .btn { display:inline-block; margin-top:18px; padding:12px 22px; border-radius:14px; background:#d9a441;
             color:#0b1e36; font-weight:800; text-decoration:none; font-size:14px; }
    </style>
  </head>
  <body>
    <div class="box">
      <div style="font-size:56px">📡</div>
      <h1>ما فيش اتصال بالإنترنت</h1>
      <p>
        الدروس والمذكرات والامتحانات اللي فتحتها قبل كدة محفوظة على جهازك وتفتح بدون نت.<br />
        المعلم الذكي محتاج اتصال لأنه بيربط بنموذج الذكاء الاصطناعي.
      </p>
      <a class="btn" href="/">الرجوع للتطبيق</a>
    </div>
  </body>
</html>
