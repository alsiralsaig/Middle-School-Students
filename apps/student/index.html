<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1E36" />
    <!-- PWA: التطبيق يتثبّت على الهاتف ويفتح بدون إنترنت -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="الطالب الذكي" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>منصة الطالب السوداني الذكية | الصف الثالث المتوسط</title>
    <meta name="description" content="منصة تعليمية إلكترونية متخصصة لطلاب الصف الثالث المتوسط بالمنهج السوداني تشمل شروحات الدروس، مكتبة المذكرات، وبنك الاختبارات." />
    <meta property="og:title" content="منصة الطالب السوداني الذكية | الصف الثالث المتوسط" />
    <meta property="og:description" content="منصة تعليمية إلكترونية متخصصة لطلاب الصف الثالث المتوسط بالمنهج السوداني تشمل شروحات الدروس، مكتبة المذكرات، وبنك الاختبارات." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sudanese_platform_theme');
          if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#071322] text-slate-900 dark:text-slate-100 antialiased font-sans selection:bg-amber-100 selection:text-amber-900">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
